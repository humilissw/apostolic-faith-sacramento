[project]
name = "app"
version = "0.1.0"
description = "Application for managing backend for AFC Sacramento"
authors = [
    {name = "humulissw",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "locust (>=2.42.6,<3.0.0)",
    "flask (>=3.1,<4.0)",
    "flask-cors (>=6.0,<7.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "mysql-connector-python (>=9.5.0,<10.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "email-validator (>=2.1.0.post1,<3.0.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "tenacity (>=8.2.3,<9.0.0)",
    "emails (>=0.6,<1.0)",
    "jinja2 (>=3.1.4,<4.0.0)",
    "alembic (>=1.12.1,<2.0.0)",
    "httpx (>=0.25.1,<1.0.0)",
    "psycopg[binary] (>=3.1.13,<4.0.0)",
    "sqlmodel (>=0.0.21,<1.0.0)",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.3.0",
    "pydantic-settings (>=2.2.1,<3.0.0)",
    "pyjwt[crypto] (>=2.11.0,<3.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "authlib (>=1.6.7,<2.0.0)",
    "jq (>=1.11.0,<2.0.0)",
    "auth0-server-python (>=1.0.0b8,<2.0.0)",
    "stripe (>=13.0.0,<14.0.0)",
    "cryptography (>=42.0.0,<44.0.0)",
    "mariadb[binary,pool] (>=2.0.0rc2,<3.0.0)",
    "waitress (>=3.0,<4.0)",
    "google-auth (>=2.23.0,<3.0.0)",
    "requests (>=2.31.0,<3.0.0)",
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests*",
    "backend/auth0sample*",
    "backend/backend_pre_start*",
    "backend/tests_pre_start*",
    "backend/initial_data*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]


[tool.alembic]

# path to migration scripts.
script_location = "%(here)s/alembic"

[tool.ruff.lint.per-file-ignores]
"backend/api/routes/login.py" = ["E712"]
"backend/api/routes/google.py" = ["E712"]

# Bandit security linter configuration
[tool.bandit]
exclude_dirs = [
    'src/flask/backend/alembic/'
]
skips = [
    "B101",  # assert_used - fine in tests and safety checks
    "B106",  # hardcoded_password_funcarg - dummy OAuth credentials in demo code
    "B201",  # flask_debug_true - sample auth0 app
    "B404",  # subprocess import - needed for setup_poetry.py
    "B310",  # urllib_open - needed for setup_poetry.py
    "B603",  # subprocess_without_shell - needed for setup_poetry.py
    "B607",  # process_beginning_with_partial_path - needed for setup_poetry.py
    "B311",  # random - fine for test code
    "B110",  # try_except_pass - intentional pass for graceful fallback
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
mariadb = {allow-prereleases = true}

[tool.poetry.group.dev.dependencies]
mypy = ">=2.0.0,<3.0.0"
flake8 = ">=6.0.0,<8.0.0"
