[project]
name = "afcapp"
version = "0.1.0"
description = "Application for managing backend for AFC Sacramento"
authors = [
    {name = "humulissw",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.124.2,<0.125.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "locust (>=2.42.6,<3.0.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "mysql-connector-python (>=9.5.0,<10.0.0)",
    "mariadb (>=1.1.14,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
