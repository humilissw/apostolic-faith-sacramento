[project]
name = "email-service"
version = "0.1.0"
description = "Email delivery microservice for Apostolic Faith Sacramento"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "a2wsgi>=1.10,<2.0",
    "pydantic[email]>=2.12.5,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "pyjwt[crypto]>=2.11.0,<3.0.0",
    "sqlalchemy>=2.0.45,<3.0.0",
    "pymysql>=1.1.2,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
