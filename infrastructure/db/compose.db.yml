# https://www.kisphp.com/posgresql/docker-compose-setup-for-postgres13-and-pgadmin4
# https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
# https://linuxhint.com/postgresql_docker/
# https://devopsheaven.com/docker/docker-compose/volumes/2018/01/16/volumes-in-docker-compose.html

networks:
  nat:
    external: true

services:
  mariadb:
    image: mariadb:12.1-ubi
    # restart: always
    env_file:
      - ./db.env
    ports:
      - 3306:3306
      - 33060:33060


# docker run -d --name my-apache-app -p 8080:80 -v "$PWD":/usr/local/apache2/htdocs/ httpd:2.4
# docker-compose -f .\compose.db.yml  up -d --build
  apache:
    image: httpd:2.4
    volumes:
      - ./public_app/:/usr/local/apache2/htdocs/
      # - ./public_html/:/usr/local/apache2/htdocs/
    ports:
      - 8080:80

  adminer:
    image: adminer
    depends_on:
      - mariadb # has to be db because it is configured to look at db
    # restart: always
    ports:
      - 5080:8080

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
