# https://www.kisphp.com/posgresql/docker-compose-setup-for-postgres13-and-pgadmin4
# https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
# https://linuxhint.com/postgresql_docker/
# https://devopsheaven.com/docker/docker-compose/volumes/2018/01/16/volumes-in-docker-compose.html

networks:
  nat:
    external: true

services:
  db:
    image: mysql:9.5.0
    # NOTE: use of "mysql_native_password" is not recommended: https://dev.mysql.com/doc/refman/8.0/en/upgrading-from-previous-series.html#upgrade-caching-sha2-password
    # (this is just an example, not intended to be a production configuration)
    # command: --default-authentication-plugin=mysql_native_password
    # command: --default-authentication-plugin=caching_sha2_password
    # restart: always
    env_file:
      - ./db.env
    # environment:
    #   # username -> root
    #   MYSQL_ROOT_PASSWORD: DisIss3cur3br4h!
    #   # caching_sha2_password: DisIss3cur3br4h!
    ports:
      - 3306:3306
      - 33060:33060

  adminer:
    image: adminer
    depends_on:
      - db # has to be db because it is configured to look at db
    # restart: always
    ports:
      - 5080:8080