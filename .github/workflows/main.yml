name: Main Workflow (parent triggers others)
run-name: Running CI on ${{ github.ref_name }}
on: [push, pull_request]
jobs:
  pre-commit:
    uses: ${{ github.repository }}/.github/workflows/pre-commit.yml@${{ github.head_ref || github.ref_name }}

  Run-CI-Python:
    needs: [ pre-commit ]
    uses: ${{ github.repository }}/.github/workflows/python.yml@${{ github.head_ref || github.ref_name }}

  Run-CI-Node:
    needs: [ pre-commit ]
    uses: ${{ github.repository }}/.github/workflows/node.yml@${{ github.head_ref || github.ref_name }}
