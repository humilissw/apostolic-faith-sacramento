name: Main Workflow (parent triggers others)
run-name: Running CI on ${{ github.ref_name }}
on: [push, pull_request]
jobs:
  pre-commit:
    uses: humilissw/apostolic-faith-sacramento/.github/workflows/pre-commit.yml@main
    with:
      ref: ${{ github.head_ref || github.ref_name }}

  Run-CI-Python:
    needs: [ pre-commit ]
    uses: humilissw/apostolic-faith-sacramento/.github/workflows/python.yml@main
    with:
      ref: ${{ github.head_ref || github.ref_name }}

  Run-CI-Node:
    needs: [ pre-commit ]
    uses: humilissw/apostolic-faith-sacramento/.github/workflows/node.yml@main
    with:
      ref: ${{ github.head_ref || github.ref_name }}
