# This workflow installs Python dependencies, runs tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ main, feature/fix-errors ]
  pull_request:
    branches: [ main, feature/fix-errors ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13.5"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        # cache: 'poetry'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        poetry --version

    - name: Wait for MySQL
      run: |
        for i in {1..30}; do
          if mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" 2>/dev/null; then
            echo "MySQL is ready"
            exit 0
          fi
          echo "Waiting for MySQL... ($i)"
          sleep 1
        done
        echo "MySQL failed to start"
        exit 1

    - name: Copy CI env file
      working-directory: src/be
      run: cp .env.ci .env

    - name: Install dependencies
      working-directory: src/be
      run: |
        poetry install

    - name: Lint with flake8
      working-directory: src/be
      run: |
        poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      working-directory: src/be
      run: |
        poetry run pytest --tb=short -v

    - name: Build Python package
      working-directory: src/be
      run: |
        poetry build

    - name: Upload pytest test results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: src/be/tests/**/*.xml
      if: ${{ failure() }}

    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-dist-${{ matrix.python-version }}
        path: src/be/dist/
      if: ${{ success() }}
